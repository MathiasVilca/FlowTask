<article class="overflow-hidden rounded-lg shadow-sm transition hover:shadow-lg">
  <div class="bg-white p-4 sm:p-6">
    <time [attr.datetime]="task().due_date" class="block text-xs text-gray-500">
      {{ task().due_date ?? 'Sin fecha' }}
    </time>

    <h3 class="mt-0.5 text-lg text-gray-900">
      {{ task().title }}
    </h3>

    @if (task().description) {
      <p class="mt-2 line-clamp-3 text-sm/relaxed text-gray-500">
        {{ task().description }}
      </p>
    }

    <div class="mt-4 flex flex-wrap gap-1">
      <span [class]="getStatusClasses(task().status)">
        {{ task().status }}
      </span>

      <span
        class="rounded-full bg-slate-100 px-2.5 py-0.5 text-xs whitespace-nowrap text-slate-700"
      >
        {{ task().category.name }}
      </span>
    </div>

    <div class="mt-5 border-t border-gray-100 pt-3 flex items-center justify-end gap-2">
      @if (task().status !== 'Completada') {
        <button
          type="button"
          (click)="onComplete()"
          class="cursor-pointer rounded-md bg-emerald-600 px-3 py-1.5 text-xs font-medium text-white shadow-xs transition hover:bg-emerald-700"
        >
          Completar
        </button>
      }

      <button
        type="button"
        (click)="onEdit()"
        class="cursor-pointer rounded-md border border-gray-300 bg-white px-3 py-1.5 text-xs font-medium text-gray-700 transition hover:bg-gray-50"
      >
        Editar
      </button>

      <button
        type="button"
        (click)="onDelete()"
        class="ursor-pointer rounded-md border border-red-200 bg-white px-3 py-1.5 text-xs font-medium text-red-600 transition hover:border-red-300 hover:bg-red-50"
      >
        Eliminar
      </button>
    </div>
  </div>
</article>
